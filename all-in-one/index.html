<script>
/* Back for the in-app tabs (Start Here / Learn / Browse All Subjects): the app keeps them in React state only,
   so remember the tab we came from and click it again on Back. Falls through to normal history when there is nothing to undo. */
(function(){
  var stack=[],replay=false,SEL='header nav[aria-label="Learn"] button';
  function btns(){return Array.prototype.slice.call(document.querySelectorAll(SEL)).filter(function(b){return b.offsetParent!==null})}
  function active(list){for(var i=0;i<list.length;i++){if(list[i].getAttribute('aria-current')==='page')return i}return -1}
  document.addEventListener('click',function(e){
    if(replay)return;
    var b=e.target.closest&&e.target.closest(SEL);if(!b)return;
    var l=btns(),from=active(l),to=l.indexOf(b);
    if(from>=0&&to>=0&&from!==to){stack.push(from);if(stack.length>40)stack.shift()}
  },true);
  window.__kvBack=function(){
    var l=btns();if(!l.length)return false;
    var cur=active(l),target=stack.length?stack.pop():(cur>0?0:-1);
    if(target<0||!l[target]||target===cur)return false;
    replay=true;try{l[target].click()}finally{setTimeout(function(){replay=false},0)}
    return true;
  };
})();
</script>
