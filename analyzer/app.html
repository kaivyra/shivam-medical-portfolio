L.mr="तुमचा वैद्यकीय अहवाल समजून घ्या|रुग्णाची माहिती|नाव|वय (वर्षे)|लिंग|पुरुष|स्त्री|शहर|अहवालाची तारीख|लक्षणे (तुमच्या भाषेत लिहा)|इतिहास, औषधे, ॲलर्जी|इतर निष्कर्ष (USG, X-Ray, ECG, बायोप्सी…)|अहवालातील मूल्ये भरा|चाचणी पॅनेल निवडा (तक्ता उघडेल)|कोणतीही चाचणी शोधा…|+ स्वतःची चाचणी जोडा|सर्व पुसा|अहवालाचे विश्लेषण करा|चाचणी|मूल्य|एकक|सामान्य मर्यादा|तुमच्या लॅबची मर्यादा (ऐच्छिक)|स्थिती|कमी|जास्त|सामान्य|गंभीर|माहिती दिलेली नाही|सारांश|असामान्य निष्कर्ष|अहवालाची पूर्णता|दिलेले नाही|अवयवानुसार|कोणत्या तज्ज्ञांना भेटावे|टाळा|फायदेशीर|पुढील चाचण्या|आणीबाणीचा इशारा|केवळ शैक्षणिक माहिती, निदान नाही. तुमच्या लॅबची छापलेली मर्यादा प्राधान्याची. निर्णय डॉक्टरांचा. आणीबाणीत 112 वर कॉल करा.|सर्व भरलेली मूल्ये सामान्य आहेत|कृपया डॉक्टरांना भेटा|अहवालाचा मजकूर पेस्ट करा|मूल्ये वाचा|अहवाल जतन करा|प्रिंट|गणना केलेली मूल्ये|भाषा|चाचण्यांची नावे आंतरराष्ट्रीय लॅब संज्ञांत. सविस्तर स्पष्टीकरण हिंदी व इंग्रजीत; इतर भाषांत लेबल, अवयवांची नावे व स्थिती भाषांतरित.|नमुना भरा|रक्त|साखर / चयापचय|हृदय / रक्तदाब|यकृत / पचन|मूत्रपिंड / इलेक्ट्रोलाइट|थायरॉईड / संप्रेरके|जीवनसत्त्वे / हाडे|संसर्ग|ट्यूमर मार्कर|स्वयंप्रतिकार / सांधे|फुफ्फुसे / ऑक्सिजन|स्वादुपिंड|लघवी / मूत्रमार्ग|कान-नाक-घसा / श्रवण|इतर";
L.te="మీ వైద్య నివేదికను అర్థం చేసుకోండి|రోగి వివరాలు|పేరు|వయస్సు (సంవత్సరాలు)|లింగం|పురుషుడు|స్త్రీ|నగరం|నివేదిక తేదీ|లక్షణాలు (మీ భాషలో రాయండి)|చరిత్ర, మందులు, అలర్జీలు|ఇతర ఫలితాలు (USG, X-Ray, ECG, బయాప్సీ…)|నివేదిక విలువలు నమోదు చేయండి|పరీక్ష ప్యానెల్ ఎంచుకోండి (పట్టిక తెరుచుకుంటుంది)|ఏదైనా పరీక్షను వెతకండి…|+ మీ స్వంత పరీక్ష జోడించండి|అన్నీ తొలగించండి|నివేదికను విశ్లేషించండి|పరీక్ష|విలువ|యూనిట్|సాధారణ పరిధి|మీ ల్యాబ్ పరిధి (ఐచ్ఛికం)|స్థితి|తక్కువ|ఎక్కువ|సాధారణం|తీవ్రం|సమాచారం ఇవ్వలేదు|సారాంశం|అసాధారణ ఫలితాలు|నివేదిక సంపూర్ణత|ఇవ్వలేదు|అవయవాల వారీగా|ఏ నిపుణుడిని కలవాలి|నివారించండి|ప్రయోజనకరం|తదుపరి పరీక్షలు|అత్యవసర హెచ్చరిక|కేవలం విద్యా సమాచారం, నిర్ధారణ కాదు. మీ ల్యాబ్ ముద్రించిన పరిధికే ప్రాధాన్యం. నిర్ణయం డాక్టర్‌దే. అత్యవసరంలో 112కు కాల్ చేయండి.|నమోదు చేసిన అన్ని విలువలు సాధారణం|దయచేసి డాక్టర్‌ను కలవండి|నివేదిక టెక్స్ట్ అతికించండి|విలువలు చదవండి|నివేదిక సేవ్ చేయండి|ప్రింట్|లెక్కించిన విలువలు|భాష|పరీక్షల పేర్లు అంతర్జాతీయ ల్యాబ్ పదాల్లో. వివరణలు హిందీ, ఆంగ్లంలో; ఇతర భాషల్లో లేబుళ్లు, అవయవాల పేర్లు, స్థితి అనువదించబడ్డాయి.|నమూనా నింపండి|రక్తం|చక్కెర / జీవక్రియ|గుండె / రక్తపోటు|కాలేయం / జీర్ణం|మూత్రపిండాలు / ఎలక్ట్రోలైట్లు|థైరాయిడ్ / హార్మోన్లు|విటమిన్లు / ఎముకలు|ఇన్ఫెక్షన్|ట్యూమర్ మార్కర్లు|ఆటోఇమ్యూన్ / కీళ్లు|ఊపిరితిత్తులు / ఆక్సిజన్|క్లోమం|మూత్రం / మూత్ర మార్గం|చెవి-ముక్కు-గొంతు / వినికిడి|ఇతర";
L.ta="உங்கள் மருத்துவ அறிக்கையைப் புரிந்துகொள்ளுங்கள்|நோயாளி விவரங்கள்|பெயர்|வயது (ஆண்டுகள்)|பாலினம்|ஆண்|பெண்|நகரம்|அறிக்கை தேதி|அறிகுறிகள் (உங்கள் மொழியில் எழுதுங்கள்)|வரலாறு, மருந்துகள், ஒவ்வாமை|பிற முடிவுகள் (USG, X-Ray, ECG, பயாப்சி…)|அறிக்கை மதிப்புகளை உள்ளிடுங்கள்|பரிசோதனை பேனலைத் தேர்ந்தெடுக்கவும் (அட்டவணை திறக்கும்)|எந்த பரிசோதனையையும் தேடுங்கள்…|+ உங்கள் பரிசோதனையைச் சேர்|அனைத்தையும் அழி|அறிக்கையை பகுப்பாய்வு செய்|பரிசோதனை|மதிப்பு|அலகு|இயல்பு வரம்பு|உங்கள் ஆய்வகத்தின் வரம்பு (விருப்பம்)|நிலை|குறைவு|அதிகம்|இயல்பு|ஆபத்தான|தரவு வழங்கப்படவில்லை|சுருக்கம்|இயல்பற்ற முடிவுகள்|அறிக்கை முழுமை|வழங்கப்படவில்லை|உறுப்பு வாரியாக|எந்த நிபுணரைப் பார்க்க வேண்டும்|தவிர்க்கவும்|நன்மை தருபவை|தொடர் பரிசோதனைகள்|அவசர எச்சரிக்கை|கல்வி தகவல் மட்டுமே, நோய் கண்டறிதல் அல்ல. உங்கள் ஆய்வகத்தின் அச்சிடப்பட்ட வரம்பே முதன்மை. முடிவு மருத்துவருடையது. அவசரத்தில் 112 அழைக்கவும்.|உள்ளிட்ட அனைத்து மதிப்புகளும் இயல்பு|தயவுசெய்து மருத்துவரைப் பார்க்கவும்|அறிக்கை உரையை ஒட்டவும்|மதிப்புகளைப் படி|அறிக்கையைச் சேமி|அச்சிடு|கணக்கிடப்பட்ட மதிப்புகள்|மொழி|பரிசோதனைப் பெயர்கள் சர்வதேச ஆய்வக சொற்களில். விரிவான விளக்கம் இந்தி, ஆங்கிலத்தில்; பிற மொழிகளில் லேபிள்கள், உறுப்புப் பெயர்கள், நிலை மொழிபெயர்க்கப்பட்டுள்ளன.|மாதிரி நிரப்பு|இரத்தம்|சர்க்கரை / வளர்சிதை மாற்றம்|இதயம் / இரத்த அழுத்தம்|கல்லீரல் / செரிமானம்|சிறுநீரகம் / எலக்ட்ரோலைட்|தைராய்டு / ஹார்மோன்|வைட்டமின் / எலும்பு|தொற்று|கட்டி குறிப்பான்கள்|தன்னுடல் தாக்கம் / மூட்டு|நுரையீரல் / ஆக்சிஜன்|கணையம்|சிறுநீர் / சிறுநீர்ப்பாதை|காது-மூக்கு-தொண்டை / செவிப்புலன்|பிற";
L.gu="તમારો મેડિકલ રિપોર્ટ સમજો|દર્દીની માહિતી|નામ|ઉંમર (વર્ષ)|લિંગ|પુરુષ|સ્ત્રી|શહેર|રિપોર્ટની તારીખ|લક્ષણો (તમારી ભાષામાં લખો)|ઇતિહાસ, દવાઓ, એલર્જી|અન્ય તારણો (USG, X-Ray, ECG, બાયોપ્સી…)|રિપોર્ટના મૂલ્યો ભરો|ટેસ્ટ પેનલ પસંદ કરો (કોષ્ટક ખુલશે)|કોઈપણ ટેસ્ટ શોધો…|+ પોતાનો ટેસ્ટ ઉમેરો|બધું સાફ કરો|રિપોર્ટનું વિશ્લેષણ કરો|ટેસ્ટ|મૂલ્ય|એકમ|સામાન્ય મર્યાદા|તમારી લેબની મર્યાદા (વૈકલ્પિક)|સ્થિતિ|ઓછું|વધુ|સામાન્ય|ગંભીર|માહિતી આપી નથી|સારાંશ|અસામાન્ય પરિણામો|રિપોર્ટની સંપૂર્ણતા|આપ્યું નથી|અંગ મુજબ|કયા નિષ્ણાતને મળવું|ટાળો|ફાયદાકારક|આગળના ટેસ્ટ|કટોકટી ચેતવણી|ફક્ત શૈક્ષણિક માહિતી, નિદાન નથી. તમારી લેબની છાપેલી મર્યાદા પ્રાથમિક છે. નિર્ણય ડૉક્ટરનો. કટોકટીમાં 112 પર કૉલ કરો.|દાખલ કરેલા બધા મૂલ્યો સામાન્ય છે|કૃપા કરીને ડૉક્ટરને મળો|રિપોર્ટનો ટેક્સ્ટ પેસ્ટ કરો|મૂલ્યો વાંચો|રિપોર્ટ સાચવો|પ્રિન્ટ|ગણતરી કરેલા મૂલ્યો|ભાષા|ટેસ્ટના નામ આંતરરાષ્ટ્રીય લેબ શબ્દોમાં. વિગતવાર સમજૂતી હિન્દી અને અંગ્રેજીમાં; અન્ય ભાષાઓમાં લેબલ, અંગોના નામ અને સ્થિતિ અનુવાદિત.|નમૂનો ભરો|લોહી|ખાંડ / ચયાપચય|હૃદય / બ્લડ પ્રેશર|લિવર / પાચન|કિડની / ઇલેક્ટ્રોલાઇટ|થાઇરોઇડ / હોર્મોન|વિટામિન / હાડકાં|ચેપ|ટ્યુમર માર્કર|ઓટોઇમ્યુન / સાંધા|ફેફસાં / ઓક્સિજન|સ્વાદુપિંડ|પેશાબ / મૂત્રમાર્ગ|કાન-નાક-ગળું / સાંભળવું|અન્ય";
L.ur="اپنی میڈیکل رپورٹ سمجھیں|مریض کی معلومات|نام|عمر (سال)|جنس|مرد|عورت|شہر|رپورٹ کی تاریخ|علامات (اپنی زبان میں لکھیں)|ہسٹری، ادویات، الرجی|دیگر نتائج (USG، X-Ray، ECG، بایوپسی…)|رپورٹ کی قدریں درج کریں|ٹیسٹ پینل منتخب کریں (جدول کھلے گا)|کوئی بھی ٹیسٹ تلاش کریں…|+ اپنا ٹیسٹ شامل کریں|سب صاف کریں|رپورٹ کا تجزیہ کریں|ٹیسٹ|قدر|اکائی|معمول کی حد|آپ کی لیب کی حد (اختیاری)|حالت|کم|زیادہ|معمول|نازک|ڈیٹا فراہم نہیں کیا گیا|خلاصہ|غیر معمولی نتائج|رپورٹ کی تکمیل|فراہم نہیں|عضو کے لحاظ سے|کس ماہر سے ملیں|پرہیز کریں|مفید|مزید ٹیسٹ|ہنگامی انتباہ|صرف تعلیمی معلومات، تشخیص نہیں۔ آپ کی لیب کی چھپی ہوئی حد مقدم ہے۔ فیصلہ ڈاکٹر کا ہے۔ ہنگامی صورت میں 112 پر کال کریں۔|درج کی گئی تمام قدریں معمول کے مطابق ہیں|براہِ کرم ڈاکٹر سے ملیں|رپورٹ کا متن پیسٹ کریں|قدریں پڑھیں|رپورٹ محفوظ کریں|پرنٹ|حساب شدہ قدریں|زبان|ٹیسٹ کے نام بین الاقوامی لیب اصطلاحات میں ہیں۔ تفصیلی وضاحت ہندی اور انگریزی میں؛ دیگر زبانوں میں لیبل، عضو کے نام اور حالت کا ترجمہ ہے۔|نمونہ بھریں|خون|شوگر / میٹابولزم|دل / بلڈ پریشر|جگر / ہاضمہ|گردہ / الیکٹرولائٹ|تھائیرائیڈ / ہارمون|وٹامن / ہڈیاں|انفیکشن|ٹیومر مارکر|آٹو امیون / جوڑ|پھیپھڑے / آکسیجن|لبلبہ|پیشاب / پیشاب کی نالی|کان-ناک-گلا / سماعت|دیگر";

L.kn="ನಿಮ್ಮ ವೈದ್ಯಕೀಯ ವರದಿಯನ್ನು ಅರ್ಥಮಾಡಿಕೊಳ್ಳಿ|ರೋಗಿಯ ವಿವರಗಳು|ಹೆಸರು|ವಯಸ್ಸು (ವರ್ಷ)|ಲಿಂಗ|ಪುರುಷ|ಮಹಿಳೆ|ನಗರ|ವರದಿಯ ದಿನಾಂಕ|ಲಕ್ಷಣಗಳು (ನಿಮ್ಮ ಭಾಷೆಯಲ್ಲಿ ಬರೆಯಿರಿ)|ಇತಿಹಾಸ, ಔಷಧಿಗಳು, ಅಲರ್ಜಿ|ಇತರ ಫಲಿತಾಂಶಗಳು (USG, X-Ray, ECG, ಬಯಾಪ್ಸಿ…)|ವರದಿಯ ಮೌಲ್ಯಗಳನ್ನು ಭರ್ತಿ ಮಾಡಿ|ಪರೀಕ್ಷಾ ಪ್ಯಾನೆಲ್ ಆಯ್ಕೆಮಾಡಿ (ಕೋಷ್ಟಕ ತೆರೆಯುತ್ತದೆ)|ಯಾವುದೇ ಪರೀಕ್ಷೆ ಹುಡುಕಿ…|+ ನಿಮ್ಮ ಪರೀಕ್ಷೆ ಸೇರಿಸಿ|ಎಲ್ಲವನ್ನೂ ಅಳಿಸಿ|ವರದಿಯನ್ನು ವಿಶ್ಲೇಷಿಸಿ|ಪರೀಕ್ಷೆ|ಮೌಲ್ಯ|ಘಟಕ|ಸಾಮಾನ್ಯ ಮಿತಿ|ನಿಮ್ಮ ಲ್ಯಾಬ್‌ನ ಮಿತಿ (ಐಚ್ಛಿಕ)|ಸ್ಥಿತಿ|ಕಡಿಮೆ|ಹೆಚ್ಚು|ಸಾಮಾನ್ಯ|ಗಂಭೀರ|ಮಾಹಿತಿ ನೀಡಿಲ್ಲ|ಸಾರಾಂಶ|ಅಸಾಮಾನ್ಯ ಫಲಿತಾಂಶಗಳು|ವರದಿಯ ಪೂರ್ಣತೆ|ನೀಡಿಲ್ಲ|ಅಂಗವಾರು|ಯಾವ ತಜ್ಞರನ್ನು ಭೇಟಿಯಾಗಬೇಕು|ತಪ್ಪಿಸಿ|ಪ್ರಯೋಜನಕಾರಿ|ಮುಂದಿನ ಪರೀಕ್ಷೆಗಳು|ತುರ್ತು ಎಚ್ಚರಿಕೆ|ಇದು ಶೈಕ್ಷಣಿಕ ಮಾಹಿತಿ ಮಾತ್ರ, ರೋಗನಿರ್ಣಯವಲ್ಲ. ನಿಮ್ಮ ಲ್ಯಾಬ್‌ನ ಮುದ್ರಿತ ಮಿತಿಗೇ ಆದ್ಯತೆ. ನಿರ್ಧಾರ ವೈದ್ಯರದು. ತುರ್ತು ಸ್ಥಿತಿಯಲ್ಲಿ 112 ಕರೆ ಮಾಡಿ.|ನಮೂದಿಸಿದ ಎಲ್ಲಾ ಮೌಲ್ಯಗಳು ಸಾಮಾನ್ಯ|ದಯವಿಟ್ಟು ವೈದ್ಯರನ್ನು ಭೇಟಿಯಾಗಿ|ವರದಿಯ ಪಠ್ಯ ಅಂಟಿಸಿ|ಮೌಲ್ಯಗಳನ್ನು ಓದಿ|ವರದಿ ಉಳಿಸಿ|ಮುದ್ರಿಸಿ|ಲೆಕ್ಕಹಾಕಿದ ಮೌಲ್ಯಗಳು|ಭಾಷೆ|ಪರೀಕ್ಷೆಗಳ ಹೆಸರುಗಳು ಅಂತಾರಾಷ್ಟ್ರೀಯ ಲ್ಯಾಬ್ ಪದಗಳಲ್ಲಿ. ವಿವರವಾದ ವಿವರಣೆ ಹಿಂದಿ ಮತ್ತು ಇಂಗ್ಲಿಷ್‌ನಲ್ಲಿ; ಇತರ ಭಾಷೆಗಳಲ್ಲಿ ಲೇಬಲ್, ಅಂಗದ ಹೆಸರು, ಸ್ಥಿತಿ ಅನುವಾದಿಸಲಾಗಿದೆ.|ಮಾದರಿ ತುಂಬಿ|ರಕ್ತ|ಸಕ್ಕರೆ / ಚಯಾಪಚಯ|ಹೃದಯ / ರಕ್ತದೊತ್ತಡ|ಯಕೃತ್ತು / ಜೀರ್ಣ|ಮೂತ್ರಪಿಂಡ / ಎಲೆಕ್ಟ್ರೋಲೈಟ್|ಥೈರಾಯ್ಡ್ / ಹಾರ್ಮೋನ್|ಜೀವಸತ್ವ / ಮೂಳೆ|ಸೋಂಕು|ಗೆಡ್ಡೆ ಸೂಚಕಗಳು|ಸ್ವಯಂ ರೋಗನಿರೋಧಕ / ಕೀಲು|ಶ್ವಾಸಕೋಶ / ಆಮ್ಲಜನಕ|ಮೇದೋಜೀರಕ|ಮೂತ್ರ / ಮೂತ್ರಮಾರ್ಗ|ಕಿವಿ-ಮೂಗು-ಗಂಟಲು / ಶ್ರವಣ|ಇತರೆ";
L.ml="നിങ്ങളുടെ മെഡിക്കൽ റിപ്പോർട്ട് മനസ്സിലാക്കുക|രോഗിയുടെ വിവരങ്ങൾ|പേര്|പ്രായം (വർഷം)|ലിംഗം|പുരുഷൻ|സ്ത്രീ|നഗരം|റിപ്പോർട്ട് തീയതി|ലക്ഷണങ്ങൾ (നിങ്ങളുടെ ഭാഷയിൽ എഴുതുക)|ചരിത്രം, മരുന്നുകൾ, അലർജി|മറ്റ് കണ്ടെത്തലുകൾ (USG, X-Ray, ECG, ബയോപ്സി…)|റിപ്പോർട്ട് മൂല്യങ്ങൾ നൽകുക|ടെസ്റ്റ് പാനൽ തിരഞ്ഞെടുക്കുക (പട്ടിക തുറക്കും)|ഏതെങ്കിലും ടെസ്റ്റ് തിരയുക…|+ സ്വന്തം ടെസ്റ്റ് ചേർക്കുക|എല്ലാം മായ്ക്കുക|റിപ്പോർട്ട് വിശകലനം ചെയ്യുക|ടെസ്റ്റ്|മൂല്യം|യൂണിറ്റ്|സാധാരണ പരിധി|നിങ്ങളുടെ ലാബിന്റെ പരിധി (ഓപ്ഷണൽ)|നില|കുറവ്|കൂടുതൽ|സാധാരണം|ഗുരുതരം|വിവരം നൽകിയിട്ടില്ല|സംഗ്രഹം|അസാധാരണ ഫലങ്ങൾ|റിപ്പോർട്ടിന്റെ പൂർണ്ണത|നൽകിയിട്ടില്ല|അവയവം തിരിച്ച്|ഏത് വിദഗ്ധനെ കാണണം|ഒഴിവാക്കുക|ഗുണകരം|തുടർ പരിശോധനകൾ|അടിയന്തര മുന്നറിയിപ്പ്|വിദ്യാഭ്യാസ വിവരം മാത്രം, രോഗനിർണയമല്ല. നിങ്ങളുടെ ലാബിന്റെ അച്ചടിച്ച പരിധിക്കാണ് മുൻഗണന. തീരുമാനം ഡോക്ടറുടേതാണ്. അടിയന്തരമെങ്കിൽ 112 വിളിക്കുക.|നൽകിയ എല്ലാ മൂല്യങ്ങളും സാധാരണം|ദയവായി ഡോക്ടറെ കാണുക|റിപ്പോർട്ട് ടെക്സ്റ്റ് പേസ്റ്റ് ചെയ്യുക|മൂല്യങ്ങൾ വായിക്കുക|റിപ്പോർട്ട് സേവ് ചെയ്യുക|പ്രിന്റ്|കണക്കാക്കിയ മൂല്യങ്ങൾ|ഭാഷ|ടെസ്റ്റ് പേരുകൾ അന്താരാഷ്ട്ര ലാബ് പദങ്ങളിൽ. വിശദീകരണം ഹിന്ദിയിലും ഇംഗ്ലീഷിലും; മറ്റ് ഭാഷകളിൽ ലേബലുകൾ, അവയവ പേരുകൾ, നില വിവർത്തനം ചെയ്തിരിക്കുന്നു.|സാമ്പിൾ നിറയ്ക്കുക|രക്തം|പഞ്ചസാര / മെറ്റബോളിസം|ഹൃദയം / രക്തസമ്മർദ്ദം|കരൾ / ദഹനം|വൃക്ക / ഇലക്ട്രോലൈറ്റ്|തൈറോയ്ഡ് / ഹോർമോൺ|വിറ്റാമിൻ / എല്ല്|അണുബാധ|ട്യൂമർ മാർക്കർ|ഓട്ടോഇമ്യൂൺ / സന്ധി|ശ്വാസകോശം / ഓക്സിജൻ|പാൻക്രിയാസ്|മൂത്രം / മൂത്രനാളി|ചെവി-മൂക്ക്-തൊണ്ട / കേൾവി|മറ്റുള്ളവ";
L.or="ଆପଣଙ୍କ ମେଡିକାଲ ରିପୋର୍ଟ ବୁଝନ୍ତୁ|ରୋଗୀଙ୍କ ସୂଚନା|ନାମ|ବୟସ (ବର୍ଷ)|ଲିଙ୍ଗ|ପୁରୁଷ|ମହିଳା|ସହର|ରିପୋର୍ଟ ତାରିଖ|ଲକ୍ଷଣ (ନିଜ ଭାଷାରେ ଲେଖନ୍ତୁ)|ଇତିହାସ, ଔଷଧ, ଆଲର୍ଜି|ଅନ୍ୟ ଫଳାଫଳ (USG, X-Ray, ECG, ବାୟୋପ୍ସି…)|ରିପୋର୍ଟର ମୂଲ୍ୟ ଭରନ୍ତୁ|ପରୀକ୍ଷା ପ୍ୟାନେଲ ବାଛନ୍ତୁ (ସାରଣୀ ଖୋଲିବ)|ଯେକୌଣସି ପରୀକ୍ଷା ଖୋଜନ୍ତୁ…|+ ନିଜ ପରୀକ୍ଷା ଯୋଡ଼ନ୍ତୁ|ସବୁ ସଫା କରନ୍ତୁ|ରିପୋର୍ଟ ବିଶ୍ଳେଷଣ କରନ୍ତୁ|ପରୀକ୍ଷା|ମୂଲ୍ୟ|ଏକକ|ସାଧାରଣ ସୀମା|ଆପଣଙ୍କ ଲ୍ୟାବ୍‌ର ସୀମା (ଇଚ୍ଛାଧୀନ)|ସ୍ଥିତି|କମ୍|ଅଧିକ|ସାଧାରଣ|ଗୁରୁତର|ସୂଚନା ଦିଆଯାଇନାହିଁ|ସାରାଂଶ|ଅସ୍ୱାଭାବିକ ଫଳାଫଳ|ରିପୋର୍ଟର ସମ୍ପୂର୍ଣ୍ଣତା|ଦିଆଯାଇନାହିଁ|ଅଙ୍ଗ ଅନୁସାରେ|କେଉଁ ବିଶେଷଜ୍ଞଙ୍କୁ ଦେଖାଇବେ|ଏଡ଼ାନ୍ତୁ|ଲାଭଦାୟକ|ପରବର୍ତ୍ତୀ ପରୀକ୍ଷା|ଜରୁରୀକାଳୀନ ଚେତାବନୀ|କେବଳ ଶିକ୍ଷାମୂଳକ ସୂଚନା, ନିଦାନ ନୁହେଁ। ଆପଣଙ୍କ ଲ୍ୟାବ୍‌ର ଛପା ସୀମା ପ୍ରାଥମିକ। ନିଷ୍ପତ୍ତି ଡାକ୍ତରଙ୍କର। ଜରୁରୀକାଳୀନ ସ୍ଥିତିରେ 112 ଡାକନ୍ତୁ।|ଦିଆଯାଇଥିବା ସମସ୍ତ ମୂଲ୍ୟ ସାଧାରଣ|ଦୟାକରି ଡାକ୍ତରଙ୍କୁ ଦେଖାନ୍ତୁ|ରିପୋର୍ଟ ଟେକ୍ସଟ୍ ପେଷ୍ଟ କରନ୍ତୁ|ମୂଲ୍ୟ ପଢ଼ନ୍ତୁ|ରିପୋର୍ଟ ସେଭ୍ କରନ୍ତୁ|ପ୍ରିଣ୍ଟ|ଗଣନା କରାଯାଇଥିବା ମୂଲ୍ୟ|ଭାଷା|ପରୀକ୍ଷା ନାମ ଆନ୍ତର୍ଜାତୀୟ ଲ୍ୟାବ୍ ଶବ୍ଦରେ। ବିସ୍ତୃତ ବ୍ୟାଖ୍ୟା ହିନ୍ଦୀ ଓ ଇଂରାଜୀରେ; ଅନ୍ୟ ଭାଷାରେ ଲେବଲ୍, ଅଙ୍ଗ ନାମ ଓ ସ୍ଥିତି ଅନୁବାଦିତ।|ନମୁନା ଭରନ୍ତୁ|ରକ୍ତ|ଶର୍କରା / ବିପାକ|ହୃଦୟ / ରକ୍ତଚାପ|ଯକୃତ / ହଜମ|ବୃକ୍କ / ଇଲେକ୍ଟ୍ରୋଲାଇଟ୍|ଥାଇରଏଡ୍ / ହରମୋନ୍|ଭିଟାମିନ୍ / ହାଡ଼|ସଂକ୍ରମଣ|ଟ୍ୟୁମର ମାର୍କର|ଅଟୋଇମ୍ୟୁନ୍ / ଗଣ୍ଠି|ଫୁସଫୁସ / ଅମ୍ଳଜାନ|ଅଗ୍ନାଶୟ|ମୂତ୍ର / ମୂତ୍ରପଥ|କାନ-ନାକ-ଗଳା / ଶ୍ରବଣ|ଅନ୍ୟାନ୍ୟ";

function derive(V,sx,age){
 const A=[],C=[],g=k=>V[k];
 if(g('rbc')>0){if(g('pcv')>0&&g('mcv')==null)A.push(['mcv',g('pcv')*10/g('rbc')]);if(g('hb')>0&&g('mch')==null)A.push(['mch',g('hb')*10/g('rbc')])}
 if(g('hb')>0&&g('pcv')>0&&g('mchc')==null)A.push(['mchc',g('hb')*100/g('pcv')]);
 if(g('creat')>0&&g('egfr')==null&&age>=18){const f=sx==1,k=f?.7:.9,a=f?-.241:-.302,x=g('creat')/k;
  const e=142*Math.pow(Math.min(x,1),a)*Math.pow(Math.max(x,1),-1.2)*Math.pow(.9938,age)*(f?1.012:1);
  A.push(['egfr',Math.round(e)]);C.push(['eGFR (CKD-EPI 2021)',Math.round(e)+' mL/min/1.73m²','creatinine, age, sex'])}
 if(g('tg')>0&&g('tg')<400){if(g('vldl')==null)A.push(['vldl',g('tg')/5]);
  if(g('ldl')==null&&g('chol')>0&&g('hdl')>0){A.push(['ldl',g('chol')-g('hdl')-g('tg')/5]);C.push(['LDL (Friedewald)',Math.round(g('chol')-g('hdl')-g('tg')/5)+' mg/dL','TC − HDL − TG/5'])}}
 if(g('chol')>0&&g('hdl')>0){if(g('nonhdl')==null)A.push(['nonhdl',g('chol')-g('hdl')]);C.push(['Chol / HDL',(g('chol')/g('hdl')).toFixed(2),'<5 desirable'])}
 if(g('tg')>0&&g('hdl')>0)C.push(['TG / HDL',(g('tg')/g('hdl')).toFixed(2),'insulin-resistance helper; no universal cut-off']);
 if(g('bili')>0&&g('dbili')>=0&&g('ibili')==null)A.push(['ibili',g('bili')-g('dbili')]);
 if(g('tprot')>0&&g('albumin')>0&&g('tprot')>g('albumin')){const gl=g('tprot')-g('albumin');
  if(g('glob')==null)A.push(['glob',gl]);if(g('agr')==null)A.push(['agr',g('albumin')/gl])}
 if(g('sgot')>0&&g('sgpt')>0&&g('plt')>0&&age>0)C.push(['FIB-4',(age*g('sgot')/(g('plt')*100*Math.sqrt(g('sgpt')))).toFixed(2),'<1.3 low fibrosis likelihood; >2.67 high (best for age 35-65)']);
 if(g('fbs')>0&&g('insulin')>0)C.push(['HOMA-IR',(g('fbs')*g('insulin')/405).toFixed(2),'often >2.5 suggests insulin resistance']);
 if(g('iron')>0&&g('tibc')>0&&g('tsat')==null)A.push(['tsat',g('iron')/g('tibc')*100]);
 if(HT>0&&WT>0&&AGE>=18&&g('bmi')==null)A.push(['bmi',WT/Math.pow(HT/100,2)]);
 if(g('bps')>0&&g('bpd')>0&&g('map')==null)A.push(['map',(g('bps')+2*g('bpd'))/3]);
 if(g('na')>0&&g('chl')>0&&g('hco3')>0&&g('ag')==null)A.push(['ag',g('na')-g('chl')-g('hco3')]);
 if(g('bun')>0&&g('creat')>0&&g('bcr')==null)A.push(['bcr',g('bun')/g('creat')]);
 if(g('mcv')>0&&g('rbc')>0)C.push(['Mentzer index',(g('mcv')/g('rbc')).toFixed(1),'<13 favours thalassaemia trait, >13 favours iron deficiency (screening only)']);
 if(g('neut')>0&&g('lymph')>0)C.push(['NLR (neutrophil/lymphocyte)',(g('neut')/g('lymph')).toFixed(2),'about 1-3 usual; higher with infection or stress']);
 if(g('sgot')>0&&g('sgpt')>0)C.push(['AST/ALT ratio (De Ritis)',(g('sgot')/g('sgpt')).toFixed(2),'>2 suggests alcohol-related injury; <1 fatty liver or viral']);
 if(g('ca')>0&&g('albumin')>0)C.push(['Albumin-corrected calcium',(g('ca')+0.8*(4-g('albumin'))).toFixed(1)+' mg/dL','Ca + 0.8 x (4 - albumin)']);
 if(g('hba1c')>0)C.push(['Estimated average glucose (eAG)',Math.round(28.7*g('hba1c')-46.7)+' mg/dL','calculated from HbA1c']);
 if(g('tg')>0&&g('hdl')>0)C.push(['AIP log(TG/HDL)',Math.log10(g('tg')/g('hdl')).toFixed(2),'<0.11 low, 0.11-0.21 medium, >0.21 high cardiovascular risk']);
 if(g('lh')>0&&g('fsh')>0)C.push(['LH:FSH ratio',(g('lh')/g('fsh')).toFixed(2),'>2 with symptoms supports PCOS; not diagnostic on its own']);
 return{A,C}}

function evaluate(RW,sx,age){AGE=age;
 const V={},items=[];
 RW.forEach(r=>{const it=rowEval(r,sx);if(!it)return;items.push(it);if(it.id)V[it.id]=it.c});
 const d=derive(V,sx,age);
 d.A.forEach(([id,c])=>{const t=TM[id];if(!isFinite(c))return;
  items.push(mkItem({id,n:t.n,v:rd(c),u:t.u,c,lo:rg(t,sx)[0],hi:rg(t,sx)[1],own:false,src:'derived',cl:t.cl,ch:t.ch,o:t.o,t}))});
 return{items,cards:d.C}}

function coverage(RW,items){
 const have=new Set(items.filter(i=>i.id).map(i=>i.id)),P=new Set();
 RW.forEach(r=>{if(r.id)P.add(TM[r.id].p)});
 const out=[];
 PANELS.forEach(([p,name])=>{if(!P.has(p))return;
  const all=T.filter(t=>t.p==p);let core=all.filter(t=>!t.opt);if(!core.length)core=all;
  const miss=core.filter(t=>!have.has(t.id));
  out.push({p,name,total:core.length,done:core.length-miss.length,pct:Math.round((core.length-miss.length)/core.length*100),miss})});
 return out}

function fmtRange(it){if(it.t&&it.t.q)return ML()=='hi'?(it.t.u=='grade'&&it.dh>=1?'Nil / Trace':'नेगेटिव'):(it.t.u=='grade'&&it.dh>=1?'Nil / Trace':'Negative');
 const lo=it.dl,hi=it.dh;
 if(isNaN(lo)&&isNaN(hi))return '–';
 if(isNaN(lo))return '≤ '+hi; if(isNaN(hi))return '≥ '+lo;
 if(lo<=0&&hi>0&&!(it.t&&it.t.lo[0]<0))return '≤ '+hi; if(hi>=5e6)return '≥ '+lo;
 return lo+' – '+hi}

function hints(V,sx){const H=[],g=k=>V[k],f=(a,b)=>H.push([a,b]),hbl=rg(TM.hb,sx)[0];
 if(g('hb')<hbl){const m=g('mcv'),fe=g('ferritin');
  if(m<80){if(g('rbc')>0&&m/g('rbc')<13&&!(fe<30))f('Hb और MCV कम, RBC अपेक्षाकृत अधिक (Mentzer<13), फेरिटिन सामान्य: थैलेसीमिया ट्रेट का पैटर्न; HbA2 जाँच से पुष्टि','Low Hb and MCV with relatively high RBC (Mentzer <13) and normal ferritin: thalassaemia-trait pattern; confirm with HbA2');
   else f('Hb व MCV कम'+(fe<30?' और फेरिटिन भी कम':'')+': आयरन की कमी का पैटर्न','Low Hb and MCV'+(fe<30?' with low ferritin':'')+': iron-deficiency pattern')}
  else if(m>100)f('Hb कम व MCV अधिक: B12 / फोलेट की कमी का पैटर्न','Low Hb with high MCV: B12 / folate deficiency pattern');
  else if(m>=80)f('Hb कम पर MCV सामान्य: पुरानी बीमारी, किडनी रोग या खून बहना संभव; रेटिकुलोसाइट जाँच','Low Hb with normal MCV: chronic disease, kidney disease or blood loss possible; consider reticulocyte count')}
 const th=g('tsh'),ft=g('ft4');
 if(th>4.5)f(ft<0.8?'TSH अधिक व FT4 कम: प्राथमिक हाइपोथायरॉइडिज़्म का पैटर्न':'TSH अधिक पर FT4 सामान्य: सब-क्लिनिकल हाइपोथायरॉइड का पैटर्न; 6-8 सप्ताह में दोबारा जाँच',ft<0.8?'High TSH with low FT4: primary hypothyroid pattern':'High TSH with normal FT4: subclinical hypothyroid pattern; repeat in 6-8 weeks');
 else if(th<0.4)f(ft>1.8?'TSH कम व FT4 अधिक: हाइपरथायरॉइड का पैटर्न':'TSH कम पर FT4 सामान्य: सब-क्लिनिकल हाइपरथायरॉइड का पैटर्न',ft>1.8?'Low TSH with high FT4: hyperthyroid pattern':'Low TSH with normal FT4: subclinical hyperthyroid pattern');
 const a=g('sgot'),b=g('sgpt');
 if(a>0&&b>0){if(a/b>2&&a>40)f('AST/ALT > 2: शराब से जुड़े लिवर नुकसान का पैटर्न','AST/ALT >2: alcohol-related liver injury pattern');else if(b>a&&b>45)f('ALT, AST से अधिक: फैटी लिवर या वायरल हेपेटाइटिस का पैटर्न','ALT higher than AST: fatty liver or viral hepatitis pattern')}
 const A1=g('hba1c'),F=g('fbs');
 if(A1>=6.5||F>=126)f('शुगर डायबिटीज़ की श्रेणी में; दोबारा जाँच से पुष्टि व डॉक्टर से सलाह','Glucose is in the diabetes range; confirm with a repeat test and see a doctor');
 else if(A1>=5.7||F>=100)f('शुगर प्री-डायबिटीज़ की श्रेणी में; खान-पान व व्यायाम से नियंत्रण संभव','Glucose is in the prediabetes range; lifestyle change can help');
 const e=g('egfr');if(e<60)f('eGFR '+Math.round(e)+' (चरण '+(e>=45?'G3a':e>=30?'G3b':e>=15?'G4':'G5')+'): किडनी रोग तभी माना जाता है जब 3 महीने बाद भी ऐसा रहे','eGFR '+Math.round(e)+' (stage '+(e>=45?'G3a':e>=30?'G3b':e>=15?'G4':'G5')+'): kidney disease is confirmed only if this persists for 3 months');
 const mets=[[g('waist'),g('waist')>=(sx?80:90)],[g('tg'),g('tg')>=150],[g('hdl'),g('hdl')<(sx?50:40)],[g('bps')||g('bpd'),g('bps')>=130||g('bpd')>=85],[g('fbs'),g('fbs')>=100]].filter(x=>x[0]>0),n=mets.filter(x=>x[1]).length;
 if(n>=3)f('मेटाबॉलिक सिंड्रोम के '+n+' मापदंड पूरे ('+mets.length+' में से जाँचे गए)','Metabolic-syndrome criteria met: '+n+' of '+mets.length+' checked');
 if(g('tlc')>11000&&g('neut')>75)f('WBC व न्यूट्रोफिल अधिक: बैक्टीरियल संक्रमण का पैटर्न','High WBC with high neutrophils: bacterial infection pattern');
 return H}
function spark(P,i,uo){const v=[...P].reverse().map(x=>x.v[i.id]).filter(x=>typeof x=='number').map(c=>(c-uo.o)/uo.f).concat(i.v);if(v.length<2)return'';
 const lo=Math.min(...v),hi=Math.max(...v),r=(hi-lo)||1,pts=v.map((y,k)=>(k*60/(v.length-1)+3).toFixed(1)+','+(18-(y-lo)/r*15).toFixed(1)).join(' ');
 return`<svg width="66" height="22" viewBox="0 0 66 22" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>`}

// ---- theme ----
function curTheme(){const t=document.documentElement.dataset.theme;return t||((window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light')}
function setTheme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem('kv_theme',t)}catch(x){}$('th').textContent=t=='dark'?'Light':'Dark'}
function toggleTheme(){setTheme(curTheme()=='dark'?'light':'dark')}
