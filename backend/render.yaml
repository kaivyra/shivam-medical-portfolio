services:
  - type: web
    name: kaivyra-content-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: kaivyra-content
      - key: DATABASE_URL
        sync: false
      - key: OWNER_ACCESS_CODE
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: CORS_ORIGINS
        value: https://kaivyra.in,https://www.kaivyra.in

