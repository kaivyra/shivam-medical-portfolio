const CASES=[{"title":"The breathless student","level":"Intermediate","topic":"Endocrinology","src":["JBDS DKA guideline (UK)","ADA Standards of Care: hyperglycaemic crises"],"vignette":"A 19-year-old student presents with vomiting, abdominal pain and deep rapid breathing. They report weeks of thirst, frequent urination and weight loss. They are drowsy and clinically dehydrated.","steps":[{"q":"Which diagnosis best unifies the presentation?","o":["Diabetic ketoacidosis","Acute asthma exacerbation","Viral gastroenteritis","Panic attack"],"a":0,"e":"The combination of osmotic symptoms, dehydration, vomiting and deep breathing strongly suggests diabetic ketoacidosis (DKA). Confirm with ketones and acid-base assessment; do not diagnose from symptoms alone."},{"q":"Which investigation set most directly establishes the suspected metabolic emergency?","o":["Blood glucose, blood ketones, venous blood gas and electrolytes","D-dimer and chest radiograph only","Thyroid function tests only","Stool culture and faecal occult blood"],"a":0,"e":"DKA assessment requires hyperglycaemia/diabetes context, ketonaemia and metabolic acidosis. Electrolytes, renal function and a venous blood gas help assess severity and guide monitored care."},{"q":"Results show glucose 480 mg/dL, high blood beta-hydroxybutyrate, pH 7.12 and bicarbonate 9 mmol/L. What is the key interpretation?","o":["Ketotic metabolic acidosis consistent with DKA","Isolated respiratory alkalosis","Uncomplicated hyperglycaemia without acidosis","Primary metabolic alkalosis"],"a":0,"e":"The raised ketones and metabolic acidosis support DKA. The anion gap and clinical context add useful information. Severity assessment and serial monitoring matter."},{"q":"What is the safest broad management principle in a monitored clinical setting?","o":["Urgent protocol-led hospital treatment with fluids, insulin and careful electrolyte monitoring","Discharge with oral fluids only","Give bicarbonate routinely to every patient","Delay treatment until HbA1c returns"],"a":0,"e":"DKA is a medical emergency. Management follows a current institutional protocol with fluid replacement, insulin and close potassium/electrolyte monitoring. This is not a self-treatment plan."},{"q":"Which treatment-related hazard must be actively monitored?","o":["Potassium shifts and hypokalaemia during treatment","Sudden iron overload","Acute angle-closure glaucoma in every case","Vitamin C toxicity"],"a":0,"e":"Serum potassium can be misleading at presentation because total-body potassium is depleted. Insulin shifts potassium into cells, so frequent monitoring and protocol-based replacement are essential."}]},{"title":"The silent inferior infarct","level":"Advanced","topic":"Cardiology","src":["ESC 2023 acute coronary syndromes guidelines","AHA/ACC chest pain guideline"],"vignette":"A 61-year-old with diabetes reports 35 minutes of central chest pressure, nausea and sweating. The pain radiates to the jaw. Initial blood pressure is 102/68 mmHg; lungs are clear.","steps":[{"q":"What is the leading time-critical diagnosis?","o":["Acute coronary syndrome, likely myocardial infarction","Stable angina","Reflux disease","Costochondritis"],"a":0,"e":"Persistent pressure with autonomic symptoms in a high-risk patient must be treated as possible acute coronary syndrome until assessed. Diabetes may alter symptom presentation."},{"q":"Which test should be obtained immediately alongside clinical assessment?","o":["12-lead ECG, with repeat ECGs if indicated","Exercise stress test during ongoing pain","Routine outpatient echocardiogram next month","Spirometry"],"a":0,"e":"A prompt 12-lead ECG is central to identifying STEMI and other high-risk patterns. Troponin testing and serial assessment complement, but do not replace, urgent ECG-based triage."},{"q":"The ECG shows ST elevation in II, III and aVF with reciprocal depression in I and aVL. What territory is implicated?","o":["Inferior myocardial territory","Anterior territory","Lateral territory only","Posterior territory only"],"a":0,"e":"II, III and aVF view the inferior wall. Reciprocal changes strengthen the interpretation. Coronary anatomy varies, so the ECG is not a substitute for full assessment."},{"q":"What is the best system-level priority?","o":["Activate the local acute coronary syndrome/reperfusion pathway without delay","Wait for all serial troponins before escalation","Arrange routine follow-up","Treat as indigestion and observe at home"],"a":0,"e":"A suspected STEMI requires immediate escalation through the local reperfusion pathway. Time to reperfusion matters; follow current regional protocols and specialist direction."},{"q":"Why should right-sided leads and haemodynamic reassessment be considered in this pattern?","o":["To assess possible right-ventricular involvement, which can affect haemodynamics and treatment choices","To confirm asthma","To diagnose aortic stenosis definitively","They are never relevant in inferior infarction"],"a":0,"e":"Inferior infarction can involve the right ventricle. Right-sided leads and careful haemodynamic assessment can identify this and influence management decisions."}]},{"title":"Fever, confusion and falling pressure","level":"Advanced","topic":"Sepsis & critical care","src":["Surviving Sepsis Campaign 2021","NICE NG51 sepsis"],"vignette":"A 72-year-old with diabetes is brought in with fever, confusion and reduced urine output. Pulse 126/min, respiratory rate 28/min and blood pressure 86/54 mmHg. The source is not yet clear.","steps":[{"q":"What is the most urgent working syndrome?","o":["Possible sepsis with shock physiology","Uncomplicated viral fever","Isolated anxiety","Chronic hypertension"],"a":0,"e":"Infection is not yet proven, but suspected infection plus altered mentation, tachycardia, tachypnoea and hypotension is high risk. Immediate escalation is required."},{"q":"Which approach best supports early assessment?","o":["ABCDE assessment, lactate, cultures where appropriate, organ-function tests and rapid source evaluation","Wait for a fever chart over 48 hours","Order only a lipid profile","Send home if oxygen saturation is normal"],"a":0,"e":"Rapid structured assessment looks for organ dysfunction and a source. Investigations should not delay urgent stabilisation and treatment in an unstable patient."},{"q":"The lactate is elevated and creatinine has risen from baseline. What does this add?","o":["Evidence of possible tissue hypoperfusion and acute organ dysfunction","Proof of a specific bacterial species","Evidence that infection is excluded","A definitive diagnosis of pulmonary embolism"],"a":0,"e":"Lactate elevation is a severity signal but is not specific. A creatinine rise suggests acute kidney injury. Interpret both with perfusion, trends and the whole clinical picture."},{"q":"What is the safest immediate systems response?","o":["Urgent senior/critical-care escalation and protocol-led resuscitation while investigating the source","Delay escalation until culture results return","Give oral antibiotics and discharge","Focus on lowering temperature alone"],"a":0,"e":"This patient is unstable. Escalation, monitoring, source evaluation and time-critical protocol-led management must occur together under qualified clinical supervision."},{"q":"Which statement about blood cultures is most accurate?","o":["Obtain promptly before antimicrobials when feasible, but do not let cultures delay urgent treatment","Cultures are never useful","A negative culture excludes sepsis","Cultures identify the source in every patient"],"a":0,"e":"Cultures can guide later therapy. In a critically ill patient, sampling should be prompt when feasible, but must not create a harmful delay in urgent treatment."}]},{"title":"The headache that changed","level":"Expert","topic":"Neurology","src":["NICE NG228 subarachnoid haemorrhage","AHA/ASA aneurysmal SAH guideline"],"vignette":"A 48-year-old develops a sudden, maximal-at-onset headache while exercising. They vomit and describe it as the worst headache of their life. No previous similar episodes.","steps":[{"q":"Which dangerous diagnosis must be prioritised?","o":["Subarachnoid haemorrhage","Tension-type headache","Uncomplicated sinusitis","Chronic migraine without red flags"],"a":0,"e":"A thunderclap headache reaching maximum intensity rapidly is a red flag for subarachnoid haemorrhage and other vascular emergencies."},{"q":"What is the appropriate first-line urgent imaging approach in a typical emergency pathway?","o":["Urgent non-contrast CT head","Routine skull X-ray","Outpatient MRI in six weeks","No imaging if the neurological exam is initially normal"],"a":0,"e":"Urgent non-contrast CT head is the usual initial investigation. The next steps depend on timing, scan quality, findings and local specialist protocol."},{"q":"The initial CT is reported negative, but clinical suspicion remains high. What is the best reasoning?","o":["A negative scan does not always end the evaluation; follow the time-dependent local pathway and seek specialist input","The diagnosis is impossible","Discharge without safety-netting","Repeat the same scan every hour"],"a":0,"e":"Sensitivity of CT depends on timing and technical/contextual factors. Persistent suspicion requires further evaluation according to current local guidance and specialist advice."},{"q":"Which additional assessment is important while the diagnosis is being clarified?","o":["Neurological status, vital signs and assessment for deterioration","Only visual acuity","Routine allergy testing","Dietary history alone"],"a":0,"e":"Serial neurological assessment and monitoring for deterioration are essential in a suspected intracranial emergency."},{"q":"What is the central learning point?","o":["A normal early examination does not neutralise a high-risk thunderclap history","All severe headaches are migraine","Imaging is unnecessary in young adults","Vomiting proves raised intracranial pressure"],"a":0,"e":"The history itself contains a high-risk signal. Avoid premature closure: recognise red flags, investigate urgently and reassess when evidence conflicts."}]},{"title":"Pleuritic pain after surgery","level":"Advanced","topic":"Respiratory & vascular","src":["ESC 2019 acute PE guideline","NICE NG158 venous thromboembolic disease"],"vignette":"A 54-year-old, six days after hip replacement, develops sudden breathlessness and sharp pleuritic chest pain. Pulse 112/min, SpO₂ 90% on air, BP 124/78 mmHg. One calf is swollen and tender.","steps":[{"q":"Which diagnosis must be actively excluded first?","o":["Pulmonary embolism","Stable angina","Hyperventilation syndrome","Chronic bronchitis"],"a":0,"e":"Recent major orthopaedic surgery, a swollen calf, tachycardia and hypoxia make venous thromboembolism with pulmonary embolism (PE) the leading dangerous diagnosis."},{"q":"What is the soundest diagnostic approach?","o":["Estimate pre-test probability with a validated score (e.g. Wells); if PE is likely, go straight to CT pulmonary angiography","Require a normal D-dimer before any imaging","Arrange spirometry and review in clinic","Exercise ECG once pain settles"],"a":0,"e":"D-dimer is useful only to rule out PE when probability is low or unlikely. With high probability, imaging is needed, and anticoagulation may start while waiting if there is no contraindication."},{"q":"CT shows bilateral segmental filling defects. BP stays normal, troponin is normal and the right ventricle looks normal. What is the best interpretation?","o":["Acute PE without haemodynamic instability, so risk-stratify and start therapeutic anticoagulation","Chronic lung disease","Pneumonia only","Immediate thrombolysis is mandatory for every PE"],"a":0,"e":"Treatment is intensity-matched. Normotensive patients are risk-stratified (clinical score, RV assessment, troponin) and anticoagulated. Thrombolysis is reserved for high-risk disease."},{"q":"Hours later BP falls to 78/40 mmHg with signs of right-ventricular strain. What changes?","o":["High-risk PE: urgent senior/critical-care input and consideration of reperfusion (e.g. systemic thrombolysis) unless contraindicated","Continue routine observation","Give large fluid boluses repeatedly as the main treatment","Treat as asthma"],"a":0,"e":"PE with shock is high risk. Reperfusion therapy is considered urgently. Excess fluid can overdistend a failing right ventricle, so volume is given cautiously."},{"q":"Which statement is most accurate?","o":["A normal ECG or normal oxygen saturation does not exclude PE","A normal chest X-ray excludes PE","PE never occurs after surgery","D-dimer is reliable for ruling out PE in the first week after surgery"],"a":0,"e":"No single bedside finding excludes PE. Surgery is a major provoking factor, and D-dimer is typically raised postoperatively, so it is unhelpful here. Duration of anticoagulation later depends on whether the event was provoked."}]},{"title":"Hives, wheeze and collapse","level":"Intermediate","topic":"Allergy & emergency","src":["Resuscitation Council UK anaphylaxis guideline","WAO anaphylaxis guidance"],"vignette":"A 26-year-old develops hives, lip swelling, wheeze and light-headedness ten minutes after a meal. BP 84/50 mmHg, pulse 128/min.","steps":[{"q":"What is the diagnosis?","o":["Anaphylaxis","Panic attack","Simple urticaria","Viral wheeze"],"a":0,"e":"Acute skin or mucosal involvement together with respiratory compromise and low blood pressure after a likely trigger meets the clinical criteria for anaphylaxis."},{"q":"What is the first-line immediate treatment?","o":["Intramuscular adrenaline into the anterolateral thigh","Oral antihistamine and observe","Intravenous steroid alone","Nebulised salbutamol alone"],"a":0,"e":"Adrenaline is the life-saving first-line drug. Give it early by the IM route. Antihistamines and steroids do not reverse airway or circulatory compromise."},{"q":"After adrenaline the patient is still hypotensive. What next?","o":["Call for resuscitation support, lay flat with legs raised, give oxygen and IV fluids, and repeat IM adrenaline after about 5 minutes if no improvement","Sit the patient upright and wait","Give a second antihistamine only","Discharge"],"a":0,"e":"Lying flat supports venous return (sit up only if breathing is the main problem). Repeat adrenaline if there is no response, with fluids, oxygen and monitoring."},{"q":"Which statement about adjunct drugs is accurate?","o":["Antihistamines and corticosteroids are secondary and never replace adrenaline","Steroids prevent all biphasic reactions","Antihistamines treat hypotension","Adrenaline is a last resort"],"a":0,"e":"Adjuncts may help skin symptoms but do not treat shock or airway obstruction. Delayed adrenaline is associated with worse outcomes."},{"q":"What should happen before discharge?","o":["Observation per local protocol, adrenaline auto-injector training, written action plan and allergy-specialist referral","Reassurance only","Advise avoiding all foods","No follow-up needed if symptoms resolve"],"a":0,"e":"Biphasic reactions can occur, so observation is risk-based. Prevention rests on trigger identification, an emergency plan, self-injector training and specialist review."}]},{"title":"The silent chest","level":"Advanced","topic":"Respiratory & vascular","src":["BTS/SIGN asthma guideline","GINA report"],"vignette":"A 22-year-old with asthma has three days of worsening wheeze. She speaks only single words. Respiratory rate 32/min, pulse 128/min, SpO₂ 90% on air, and the chest is quiet on auscultation.","steps":[{"q":"What does the quiet chest suggest?","o":["Life-threatening asthma with very little air movement","Improvement of the attack","Pneumothorax only","A normal finding"],"a":0,"e":"A silent chest, inability to speak, exhaustion, cyanosis and hypoxia are life-threatening features. Wheeze can vanish because airflow is too low."},{"q":"Which initial treatment is correct?","o":["Titrated oxygen (target SpO₂ 94–98%), repeated or continuous nebulised salbutamol, ipratropium and early systemic corticosteroids","Sedation to reduce anxiety","Antibiotics alone","Oral antihistamines"],"a":0,"e":"Severe asthma needs oxygen, high-dose short-acting beta-agonist, ipratropium bromide and early steroids, with continuous monitoring."},{"q":"She is tiring despite treatment. What next?","o":["Senior and critical-care review, consider IV magnesium sulphate, and prepare for ventilatory support","Discharge with a reliever inhaler","Reduce monitoring","Give a sedative"],"a":0,"e":"Poor response means escalation. Exhaustion warns of impending respiratory failure, and IV magnesium is an option in severe attacks."},{"q":"Why is a normal PaCO₂ worrying in this patient?","o":["A breathless asthmatic should be overbreathing with a low CO₂, so a normal or high value signals tiring","CO₂ is irrelevant in asthma","It shows the asthma is mild","It proves pneumonia"],"a":0,"e":"A normal or raised CO₂ in an acute severe attack is an ominous sign of fatigue and needs urgent senior and ICU input."}]},{"title":"Vomiting blood in cirrhosis","level":"Advanced","topic":"Gastroenterology","src":["Baveno VII consensus","AASLD portal hypertension guidance"],"vignette":"A 58-year-old man with alcohol-related cirrhosis vomits fresh blood. Pulse 118/min, BP 92/58 mmHg, Hb 82 g/L.","steps":[{"q":"What is the most likely source?","o":["Variceal bleeding from portal hypertension","Gastro-oesophageal reflux","Haemorrhoids","A trivial throat irritation"],"a":0,"e":"In cirrhosis, haematemesis is variceal until proven otherwise, though ulcers and other lesions remain possible."},{"q":"Which first steps are best?","o":["Resuscitation with IV access, a vasoactive drug such as terlipressin, and antibiotic prophylaxis","Large-volume crystalloid until BP is normal","Oral antacid and discharge","Aspirin"],"a":0,"e":"Early vasoactive therapy and antibiotics improve outcomes. Over-resuscitation can raise portal pressure and rebleeding."},{"q":"Which transfusion approach is recommended?","o":["Restrictive: transfuse around Hb 70 g/L aiming for 70–90 g/L, individualised in shock or cardiac disease","Aim for Hb above 120 g/L","Never transfuse","Transfuse only after endoscopy"],"a":0,"e":"A restrictive strategy is supported in variceal bleeding. Ongoing major bleeding and cardiovascular disease justify individual decisions."},{"q":"When should endoscopy be done?","o":["Within 12 hours of presentation once resuscitated, with band ligation if varices are found","After one week","Only if bleeding lasts 5 days","Not needed once drugs are given"],"a":0,"e":"Early endoscopy after stabilisation allows diagnosis and endoscopic band ligation of varices."}]},{"title":"Sudden weakness and slurred speech","level":"Advanced","topic":"Neurology","src":["AHA/ASA acute ischaemic stroke guideline","European Stroke Organisation guideline","NICE NG128 stroke"],"vignette":"A 67-year-old man develops sudden right arm weakness and slurred speech 70 minutes ago. BP 168/92 mmHg, glucose normal.","steps":[{"q":"What is the immediate priority?","o":["Activate the acute stroke pathway and record the last-known-well time","Book an outpatient MRI","Give aspirin and wait","Reassure, since symptoms usually settle"],"a":0,"e":"Stroke is time-critical. The last-known-well time decides eligibility for reperfusion therapy."},{"q":"Which first imaging is correct?","o":["Immediate non-contrast CT head, with CT angiography where available","Chest X-ray","Carotid ultrasound next week","EEG"],"a":0,"e":"Urgent CT excludes haemorrhage, and angiography identifies a large-vessel occlusion."},{"q":"CT shows no haemorrhage. What reperfusion options apply?","o":["IV thrombolysis if within the window and eligible, and thrombectomy if a large-vessel occlusion is confirmed","Thrombolysis before imaging","Heparin infusion","No treatment exists"],"a":0,"e":"Eligible patients get thrombolysis within the guideline window. Selected large-vessel occlusions are considered for thrombectomy, sometimes later than thrombolysis allows."},{"q":"What must be checked before thrombolysis?","o":["Exclusion of haemorrhage and contraindications, glucose, and BP below the guideline threshold (commonly 185/110 mmHg)","Cholesterol result","Only the patient’s age","Nothing, because time alone matters"],"a":0,"e":"Hypoglycaemia mimics stroke, and uncontrolled hypertension raises bleeding risk. Follow the local protocol."}]},{"title":"Weakness after missed dialysis","level":"Advanced","topic":"Nephrology","src":["UK Kidney Association hyperkalaemia guideline","Resuscitation Council UK"],"vignette":"A 70-year-old with chronic kidney disease missed dialysis and has weakness and palpitations. The ECG shows peaked T waves and a widened QRS. Potassium is 7.3 mmol/L.","steps":[{"q":"What is the most urgent first treatment?","o":["IV calcium (e.g. calcium gluconate) to stabilise the cardiac membrane","Dietary potassium restriction only","Repeat the test and wait","Oral calcium"],"a":0,"e":"ECG changes make this life-threatening. IV calcium protects the myocardium but does not lower potassium."},{"q":"Which treatments shift potassium into cells?","o":["Insulin with glucose, and nebulised salbutamol","Furosemide only","Calcium alone","Normal saline only"],"a":0,"e":"Insulin-glucose and beta-agonists act within minutes. Monitor glucose to avoid hypoglycaemia."},{"q":"How is potassium actually removed?","o":["Dialysis, potassium binders, or loop diuretics where the kidneys respond","Insulin","Calcium","Salbutamol"],"a":0,"e":"Shifting is temporary. Removal needs dialysis in this patient, and levels can rebound, so repeat monitoring is essential."},{"q":"Which drugs commonly contribute and should be reviewed?","o":["ACE inhibitors, ARBs, potassium-sparing diuretics and NSAIDs","Statins only","Proton pump inhibitors only","Paracetamol"],"a":0,"e":"Renin–angiotensin blockers, potassium-sparing diuretics and NSAIDs all raise potassium, especially in kidney disease."}]},{"title":"Collapse with abdominal pain","level":"Advanced","topic":"Obstetrics & gynaecology","src":["NICE NG126 ectopic pregnancy","RCOG Green-top Guideline 21"],"vignette":"A 28-year-old woman has sudden lower abdominal pain, light vaginal bleeding and a faint. Her last period was seven weeks ago. Pulse 124/min, BP 88/50 mmHg.","steps":[{"q":"Which diagnosis must be considered first?","o":["Ruptured ectopic pregnancy","Urinary tract infection","Gastroenteritis","Dysmenorrhoea"],"a":0,"e":"Pain, bleeding and collapse after missed menses in a woman of reproductive age is an ectopic pregnancy until proven otherwise."},{"q":"What is the correct first approach?","o":["Resuscitate and obtain an urgent pregnancy test (β-hCG) at the same time","Colonoscopy","Wait for the next period","Oral analgesia and observation"],"a":0,"e":"Every woman of reproductive age with abdominal pain and collapse needs a pregnancy test. Resuscitation must not be delayed."},{"q":"She remains unstable. What is the management?","o":["Senior gynaecology and anaesthetic involvement and emergency surgery","Methotrexate and discharge","Observe for 48 hours","Oral analgesia only"],"a":0,"e":"Instability suggests rupture with intraperitoneal bleeding, so emergency surgery is indicated."},{"q":"Who may be suitable for methotrexate?","o":["A stable woman with an unruptured ectopic, low hCG, minimal pain and reliable follow-up","A woman in shock","Any woman with a ruptured tube","A woman with a normal intrauterine pregnancy"],"a":0,"e":"Medical management is reserved for carefully selected stable women who can attend follow-up."}]},{"title":"Fever and a spreading purpuric rash","level":"Expert","topic":"Infectious disease","src":["NICE NG240 meningitis and meningococcal disease","ESCMID bacterial meningitis guideline"],"vignette":"A 19-year-old student has fever, severe headache, photophobia and vomiting for 12 hours. A non-blanching rash is spreading. Temperature 39.4 °C, pulse 130/min.","steps":[{"q":"What is the leading diagnosis?","o":["Meningococcal sepsis with possible meningitis","A viral exanthem","Contact dermatitis","Migraine"],"a":0,"e":"Fever with a non-blanching rash and systemic toxicity is meningococcal disease until proven otherwise."},{"q":"What is the most important immediate action?","o":["Give parenteral antibiotics (e.g. ceftriaxone) immediately with resuscitation, without waiting for tests","Wait for a lumbar puncture","Give oral antibiotics","Wait for imaging"],"a":0,"e":"Delay in antibiotics increases mortality. Take blood cultures if this does not delay treatment."},{"q":"When should lumbar puncture be deferred?","o":["In shock or severe sepsis, with signs of raised intracranial pressure, or with coagulopathy","Never; it is always done before antibiotics","Only in the elderly","Only if the CT is normal"],"a":0,"e":"LP is unsafe in these situations. Stabilise first and use blood cultures and PCR for diagnosis."},{"q":"What is true of dexamethasone?","o":["It is an adjunct in suspected bacterial meningitis per local protocol and never replaces antibiotics","It replaces antibiotics","It is given only after three days","It is never used"],"a":0,"e":"Corticosteroids can reduce complications in bacterial meningitis but are an adjunct. Follow current local protocol."}]},{"title":"Breathless in the night","level":"Intermediate","topic":"Cardiology","src":["ESC heart failure guidelines","NICE NG106 chronic heart failure"],"vignette":"A 72-year-old with known heart failure wakes severely breathless and cannot lie flat. RR 34/min, SpO₂ 86% on air, pulse 112/min, BP 150/90 mmHg, bibasal crackles, raised JVP and leg oedema.","steps":[{"q":"What is the most likely diagnosis?","o":["Acute decompensated heart failure with pulmonary oedema","Isolated panic attack","Pulmonary fibrosis exacerbation","Pleural effusion alone"],"a":0,"e":"Orthopnoea, crackles, raised JVP and oedema in known heart failure point to acute pulmonary oedema."},{"q":"Which initial management is correct?","o":["Sit upright, treat hypoxia with oxygen, give an IV loop diuretic, IV nitrate if BP is adequate, and consider non-invasive ventilation","Lie flat and give a large IV fluid bolus","Give an IV beta-blocker bolus","Give antibiotics alone"],"a":0,"e":"Diuretics and vasodilators relieve congestion. Fluids and early beta-blocker boluses can worsen acute decompensation."},{"q":"Which precipitants should be sought?","o":["Acute coronary syndrome, arrhythmia, infection, uncontrolled hypertension, missed medication and renal dysfunction","Only excessive exercise","None, because it is always chronic","Only dietary fat"],"a":0,"e":"Treating the trigger is part of treating the episode."},{"q":"Which early tests are most useful?","o":["ECG, chest X-ray, troponin, natriuretic peptide, renal function and echocardiography","Natriuretic peptide alone","Echocardiography after one month","D-dimer to confirm"],"a":0,"e":"These tests confirm congestion, look for ischaemia or arrhythmia and assess ventricular function."}]},{"title":"Palpitations and low blood pressure","level":"Advanced","topic":"Cardiology","src":["ESC 2024 atrial fibrillation guidelines","NICE NG196 atrial fibrillation","Resuscitation Council UK tachycardia algorithm"],"vignette":"A 74-year-old has palpitations, light-headedness and chest pain. Pulse 170/min, irregularly irregular, BP 82/50 mmHg. The ECG shows atrial fibrillation.","steps":[{"q":"Why is this an emergency?","o":["Hypotension and chest pain are adverse features showing instability caused by the arrhythmia","AF is always benign","The rate is below treatment threshold","The BP is normal"],"a":0,"e":"Shock, syncope, ischaemia or heart failure with tachycardia mean the rhythm itself is compromising the patient."},{"q":"What is the preferred treatment?","o":["Synchronised DC cardioversion under sedation or anaesthesia with senior support","Oral beta-blocker and discharge","Adenosine bolus","Observation only"],"a":0,"e":"Unstable tachyarrhythmia needs urgent synchronised cardioversion. Anticoagulation around cardioversion follows guideline."},{"q":"A stable patient has long-standing AF with a rate of 130/min. What is the usual first approach?","o":["Rate control (beta-blocker or rate-limiting calcium-channel blocker) and anticoagulation assessment","Immediate cardioversion for everyone","Aspirin only","No treatment"],"a":0,"e":"Avoid diltiazem and verapamil in reduced ejection fraction. Rhythm control may be chosen for selected patients."},{"q":"How is stroke prevention decided?","o":["With a validated risk score (e.g. CHA₂DS₂-VASc, or CHA₂DS₂-VA in the 2024 ESC guideline) and a bleeding-risk review","By symptoms only","Aspirin for everyone","Only if the rate is fast"],"a":0,"e":"Stroke risk, not whether AF is paroxysmal or persistent, drives anticoagulation."}]},{"title":"Fever, cough and new confusion","level":"Intermediate","topic":"Respiratory & vascular","src":["BTS community-acquired pneumonia guideline","ATS/IDSA community-acquired pneumonia guideline"],"vignette":"A 78-year-old has three days of fever and productive cough, now with confusion. RR 32/min, BP 96/58 mmHg, urea 11 mmol/L, SpO₂ 89%.","steps":[{"q":"What is the CURB-65 score?","o":["5, which means high severity needing urgent senior or critical-care assessment","1, suitable for home","0","2, suitable for outpatient care"],"a":0,"e":"Confusion, urea above 7 mmol/L, RR 30 or more, diastolic BP 60 or below (or systolic below 90) and age 65 or more each score one point."},{"q":"Which immediate actions are right?","o":["Oxygen, IV fluids as needed, blood cultures, and prompt IV antibiotics per local guideline","Wait for sputum culture","Oral antibiotics at home","Cough suppressants only"],"a":0,"e":"Severe pneumonia needs early antibiotics and resuscitation. Do not wait for microbiology."},{"q":"Which investigations help?","o":["Chest X-ray, blood tests, gas with lactate, blood cultures and, where appropriate, urinary antigens","None","MRI brain","Echocardiogram only"],"a":0,"e":"Imaging confirms consolidation, and gas, lactate and cultures assess severity and organism."},{"q":"Why not rely on the score alone?","o":["Scores support but never replace clinical judgement, because hypoxia, comorbidity and social factors matter","Scores are always wrong","It only applies to children","Hypoxia is irrelevant"],"a":0,"e":"Severity scores are tools. The whole clinical picture decides the setting of care."}]},{"title":"Vomiting, diarrhoea and low urine output","level":"Intermediate","topic":"Nephrology","src":["KDIGO AKI guideline","NICE NG148 acute kidney injury"],"vignette":"An 80-year-old taking an ACE inhibitor and an NSAID has three days of vomiting and diarrhoea with low urine output. Creatinine has risen from 90 to 210 µmol/L, BP 98/60 mmHg, potassium 5.9 mmol/L.","steps":[{"q":"What is the most likely problem?","o":["Acute kidney injury, probably pre-renal and worsened by drugs","Chronic stable kidney disease","Glomerulonephritis for certain","Normal ageing"],"a":0,"e":"Volume loss plus an ACE inhibitor and NSAID reduces renal perfusion."},{"q":"What is the best first management?","o":["Assess volume status, give IV fluids if hypovolaemic, and withhold the ACE inhibitor and NSAID","Give a nephrotoxic antibiotic","Increase the NSAID","Restrict all fluids"],"a":0,"e":"Treat the cause: restore perfusion and stop nephrotoxic or haemodynamic drugs."},{"q":"Which checks exclude other causes?","o":["Urinalysis, a urinary tract ultrasound for obstruction, and a full drug review","Skin biopsy","CT head","Liver biopsy"],"a":0,"e":"Obstruction is reversible and must not be missed. Urinalysis helps identify intrinsic renal disease."},{"q":"When is urgent renal replacement therapy considered?","o":["Refractory hyperkalaemia, severe acidosis, fluid overload or uraemic complications","Any rise in creatinine","Only when creatinine doubles","Never in older adults"],"a":0,"e":"Dialysis is indicated by life-threatening complications, not  Q.res[Q.i]=ok;{const sg=document.querySelectorAll(".seg i")[Q.i];if(sg)sg.className=ok?"g":"r"}if(ok){Q.correct++;Q.score+=100+Math.round(Q.sec*2/(P.set.t===1?1.5:1))}else Q.missed.push({k,q:it.q,t:j<0?"No answer (time up)":it.o[Q.ord[j]],r:it.o[it.a],e:it.e});
 rec(it,ok);if(P.set.t!==2&&j>=0){P.rt.n++;P.rt.s+=lim()-Q.sec}save();emit("answer",{question:it.q,correct:ok,mode:Q.mode});
